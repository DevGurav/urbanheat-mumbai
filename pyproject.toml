[project]
name = "urbanheat"
version = "0.1.0"
description = "Surface urban heat island analysis and mitigation planning for Mumbai"
readme = "README.md"
# 3.14 is deliberately excluded: geopandas/pyproj/shapely wheels lag the newest CPython,
# and a source build needs a GEOS/PROJ toolchain that is painful on Windows.
requires-python = ">=3.11,<3.14"

dependencies = [
    # --- Earth Engine (Phase 0+) ---
    "earthengine-api>=1.4",
    "geemap>=0.35",
    # --- Geospatial (Phase 1+) ---
    "geopandas>=1.0",
    # GeoParquet writer for the feature table and grid intermediates.
    "pyarrow>=17",
    # OpenStreetMap buildings/roads/parks via Overpass (Phase 1 OSM stage).
    "osmnx>=2.0",
    # Open-Meteo historical weather archive (keyless HTTP).
    "requests>=2.32",
    # --- ML (Phase 2+) ---
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "joblib>=1.4",
    "shap>=0.46",
    # --- Backend (Phase 3+) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # --- Config ---
    "python-dotenv>=1.0",
    "pydantic-settings>=2.4",
    # --- Notebook runtime ---
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "langchain-google-genai>=4.3.1",
    "langchain-groq>=1.1.3",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.1",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0", "httpx>=0.27"]  # httpx: FastAPI TestClient

# The pipeline is a real package from Phase 1 so `python -m data_pipeline.run` works
# without sys.path manipulation. Note the underscore: `data-pipeline` with a hyphen is
# not a legal Python module name, which is why the directory was renamed at Phase 1 kickoff.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline", "backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Data-backed tests skip cleanly when the gitignored parquets have not been built yet, so a
# fresh clone still gets a green pure-logic run.
addopts = "-q"
