[project]
name = "urbanheat"
version = "1.0.0"
description = "Surface urban heat island analysis and mitigation planning for Mumbai"
readme = "README.md"
# 3.14 is deliberately excluded: geopandas/pyproj/shapely wheels lag the newest CPython,
# and a source build needs a GEOS/PROJ toolchain that is painful on Windows.
requires-python = ">=3.11,<3.14"

# Everything `backend/main.py` actually imports, directly or through `data_pipeline.config`/
# `data_pipeline.ml.*` (the two modules the backend touches — checked by grepping backend/'s
# import graph, Phase 6 kickoff, PROGRESS.md's Deployment task). This is the set the Docker
# image installs: Render's free tier caps memory at 512MB. Data-acquisition and training-only
# tooling lives in the `pipeline` extra below.
dependencies = [
    # --- Geospatial (Phase 1+) — features.parquet is geopandas-read at every request ---
    "geopandas>=1.0",
    "pyarrow>=17",
    "requests>=2.32",
    # --- ML (Phase 2+) — model.joblib unpickles to an XGBRegressor (xgboost's sklearn
    # wrapper, data_pipeline/ml/train.py), so both packages are needed to load it, not just
    # xgboost. SHAP values are precomputed at train time and stored as shap_values.parquet —
    # the `shap` package itself is never imported here, only pandas reads its output.
    "scikit-learn>=1.5",
    # The official minimal build (same maintainers, same `import xgboost` namespace) — the
    # regular `xgboost` wheel bundles nvidia-nccl-cu12 (289MB) unconditionally on Linux for
    # distributed multi-GPU training, a capability this solo-laptop project has never used
    # (ADR-0006 chose gradient-boosted trees partly to avoid exactly this kind of GPU/cluster
    # infra). Caught the same way as the torch CUDA issue above: watching the Docker build.
    "xgboost-cpu>=2.0",
    "joblib>=1.4",
    # --- Backend (Phase 3+) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # --- Config ---
    "python-dotenv>=1.0",
    "pydantic-settings>=2.4",
    # --- Agents (Phase 4+) ---
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    # Also embeds the RAG knowledge base and every retrieval query (backend/rag/ingest.py,
    # retrieve.py) via Gemini's API (ADR-0013) — not `sentence-transformers`+`torch` anymore.
    # That local-model path cost ~500MB resident for torch's runtime alone, more than
    # Render free tier's entire 512MB budget — discovered via a live OOM kill deploying this
    # phase, not assumed. The trade: a live network call per embedding, against a rate limit
    # of unconfirmed size, for a backend that actually boots.
    "langchain-google-genai>=4.3.1",
    "chromadb>=1.5.9",
]

[project.optional-dependencies]
# Data acquisition, training, and notebook tooling — run once, deliberately, on the author's
# own machine (ADR-0004), never at request time. `uv sync --extra pipeline` for pipeline work
# or the full test suite; the Docker image never installs this extra.
pipeline = [
    "earthengine-api>=1.4",
    "geemap>=0.35",
    # OpenStreetMap buildings/roads/parks via Overpass (Phase 1 OSM stage).
    "osmnx>=2.0",
    # Training-time only: data_pipeline/ml/train.py compares it against XGBoost, but the
    # shipped model.joblib is XGBoost (store.py), so backend never needs lightgbm installed.
    "lightgbm>=4.3",
    # Explanation values are computed once at train time and shipped as shap_values.parquet
    # (data_pipeline/ml/explain.py) — the library itself is a training-time tool.
    "shap>=0.46",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    # Unused as of ADR-0011 (Groq fallback dropped) — kept for the "Revisit if" case there,
    # not imported anywhere today.
    "langchain-groq>=1.1.3",
    # Ad-hoc source-document conversion for the RAG knowledge base (docs/references.md) —
    # not called by any committed module; used interactively when a new PDF source is added.
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0", "httpx>=0.27"]  # httpx: FastAPI TestClient

# The pipeline is a real package from Phase 1 so `python -m data_pipeline.run` works
# without sys.path manipulation. Note the underscore: `data-pipeline` with a hyphen is
# not a legal Python module name, which is why the directory was renamed at Phase 1 kickoff.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline", "backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern calls Depends()/Query() in argument defaults by design (B008 otherwise
# flags it as a mutable-default footgun). More Depends(get_current_user) call sites are coming
# with the saved-scenarios write endpoints (PROGRESS.md's next Phase 6 task).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Data-backed tests skip cleanly when the gitignored parquets have not been built yet, so a
# fresh clone still gets a green pure-logic run.
addopts = "-q"
