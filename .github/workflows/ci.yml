# CI — Phase 6 Deployment (PROGRESS.md). Distinct from monitoring.yml (the daily heat-wave
# cron trigger against a deployed backend); this one runs on every push/PR and never touches
# a deployed anything.
#
# Runs the pure-logic + mocked-external-service test suite only — not the full pipeline.
# conftest.py already skips any test needing the gitignored data/model artifacts
# (features.parquet, model.joblib, ...) when they're absent, which they always are here: no
# Earth Engine credentials exist in this environment, and shouldn't (ADR-0004 — the pipeline
# is a deliberate local action, never something CI regenerates). `--extra pipeline` is still
# installed so pipeline-only test modules import cleanly rather than skip at collection.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --frozen --extra pipeline --group dev
      - run: uv run ruff check backend data_pipeline tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
